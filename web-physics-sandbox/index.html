<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Sandbox</title>
<style>
  :root { --bg: #0d1017; --panel: rgba(18, 22, 32, 0.86); --line: #2a3142; --text: #e7eaf3; --muted: #8b93a7; --accent: #ffb454; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .group { pointer-events: auto; display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 5px; backdrop-filter: blur(6px); flex-wrap: wrap; }
  .group span { color: var(--muted); padding: 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  button { background: transparent; border: 1px solid transparent; color: var(--text); border-radius: 7px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, 0.06); }
  button.on { border-color: var(--accent); color: var(--accent); background: rgba(255, 180, 84, 0.08); }
  .stats { position: fixed; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 10px; font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
  .hint { position: fixed; left: 12px; bottom: 12px; color: var(--muted); font-size: 12px; max-width: calc(100vw - 260px); }
  @media (max-width: 700px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <div class="group" id="scenes"><span>Scene</span></div>
  <div class="group" id="tools"><span>Tool</span></div>
  <div class="group">
    <button id="pause">Pause</button><button id="step">Step</button><button id="slow">Slow-mo</button>
    <button id="debug">Contacts</button><button id="reset">Reset</button>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="stats" id="stats"></div>

<script src="physics.js"></script>
<script>
(() => {
  const { World, Body, DistanceJoint, V, box, circle, regular, add, sub, scale, len } = window.Physics;
  const canvas = document.getElementById("c"), g = canvas.getContext("2d");
  const PALETTE = ["#ffb454", "#ff6b6b", "#4ecdc4", "#a78bfa", "#7bd389", "#f472b6", "#60a5fa", "#fbbf24"];
  let world, paused = false, slow = false, debug = false, tool = "drag", sceneName = "Pyramid";
  let view = { cx: 0, cy: 9, scale: 30 };
  let colorIndex = 0;
  const nextColor = () => PALETTE[colorIndex++ % PALETTE.length];

  // ---------------------------------------------------------------- scenes
  function base() {
    world = new World();
    world.add(new Body(box(120, 2), 0, -1, { static: true, friction: 0.7, color: "#2a3142" }));
    colorIndex = 0;
  }
  const SCENES = {
    Pyramid() {
      base();
      const rows = 13;
      for (let r = 0; r < rows; r++)
        for (let i = 0; i < rows - r; i++)
          world.add(new Body(box(1, 1), (i - (rows - r - 1) / 2) * 1.05, 0.5 + r, { friction: 0.6, color: PALETTE[r % PALETTE.length] }));
      return "Drag boxes out, or switch to Ball and throw things at it.";
    },
    Dominoes() {
      base();
      world.add(new Body(box(8, 0.4), -14, 6, { static: true, angle: -0.45, color: "#2a3142" }));
      for (let i = 0; i < 22; i++) world.add(new Body(box(0.25, 2.2), -9 + i * 1.05, 1.1, { friction: 0.5, density: 2, color: PALETTE[i % 2 ? 0 : 6] }));
      world.add(new Body(circle(0.5), -17, 8.5, { density: 4, color: "#ff6b6b" }));
      for (let i = 0; i < 4; i++) world.add(new Body(box(1, 1), 15 + i * 0.2, 0.5 + i, { color: "#a78bfa" }));
      return "The ball rolls down the ramp and starts the chain reaction.";
    },
    Bridge() {
      base();
      const left = world.add(new Body(box(1, 6), -12, 3, { static: true, color: "#2a3142" }));
      const right = world.add(new Body(box(1, 6), 12, 3, { static: true, color: "#2a3142" }));
      const n = 22, w = 23 / n;
      let prev = left, prevAnchor = V(-11.5, 5.8);
      for (let i = 0; i < n; i++) {
        const plank = world.add(new Body(box(w * 0.92, 0.25), -11.5 + w * (i + 0.5), 5.8, { friction: 0.8, color: "#c58b4b" }));
        world.addJoint(new DistanceJoint(prev, plank, prevAnchor, V(-11.5 + w * i, 5.8)));
        prev = plank;
        prevAnchor = V(-11.5 + w * (i + 1), 5.8);
      }
      world.addJoint(new DistanceJoint(prev, right, prevAnchor, V(11.5, 5.8)));
      for (let i = 0; i < 6; i++) world.add(new Body(i % 2 ? circle(0.55) : box(1.1, 1.1), -6 + i * 2.4, 9 + i * 0.6, { color: nextColor() }));
      return "A rope bridge made of planks and joints. Drop things on it.";
    },
    "Wrecking ball"() {
      base();
      const pivot = V(-2, 17);
      const top = world.add(new Body(box(0.6, 0.6), pivot.x, pivot.y, { static: true, color: "#2a3142" }));
      let prev = top, prevPoint = pivot;
      const links = 7, linkLen = 1.3;                                  // links swing out to the left
      for (let i = 1; i <= links; i++) {
        const p = V(pivot.x - i * linkLen, pivot.y);
        const link = world.add(new Body(circle(0.2), p.x, p.y, { density: 20, color: "#8b93a7" }));
        world.addJoint(new DistanceJoint(prev, link, prevPoint, p));
        prev = link; prevPoint = p;
      }
      const ballPos = V(prevPoint.x - 1.4, pivot.y);
      const ball = world.add(new Body(circle(1.1), ballPos.x, ballPos.y, { density: 3, restitution: 0.1, color: "#ff6b6b" }));
      world.addJoint(new DistanceJoint(prev, ball, prevPoint, ballPos));
      // a tower of posts and slabs to knock down
      let y = 0;
      for (let level = 0; level < 6; level++) {
        world.add(new Body(box(0.5, 1.6), 1.2, y + 0.8, { friction: 0.7, color: PALETTE[level % PALETTE.length] }));
        world.add(new Body(box(0.5, 1.6), 3.8, y + 0.8, { friction: 0.7, color: PALETTE[level % PALETTE.length] }));
        world.add(new Body(box(3.4, 0.4), 2.5, y + 1.8, { friction: 0.7, color: PALETTE[(level + 3) % PALETTE.length] }));
        y += 2;
      }
      return "A heavy ball on a chain swings into a tower. Drag it back for a bigger hit.";
    },
    Avalanche() {
      base();
      world.add(new Body(box(0.6, 8), -9, 4, { static: true, color: "#2a3142" }));
      world.add(new Body(box(0.6, 8), 9, 4, { static: true, color: "#2a3142" }));
      world.add(new Body(box(9, 0.4), -4, 13, { static: true, angle: -0.3, color: "#2a3142" }));
      world.add(new Body(box(9, 0.4), 4, 10, { static: true, angle: 0.3, color: "#2a3142" }));
      let n = 0;
      const timer = setInterval(() => {
        if (sceneName !== "Avalanche" || n >= 90) return clearInterval(timer);
        if (paused) return;
        const k = n % 4, x = -6 + Math.random() * 3;
        world.add(new Body(k === 0 ? circle(0.35 + Math.random() * 0.25) : k === 1 ? box(0.7, 0.7) : regular(k + 2, 0.45), x, 18,
          { angle: Math.random() * 6, color: nextColor(), restitution: 0.2 }));
        n++;
      }, 90);
      return "Shapes pour down two ramps into a bin.";
    },
  };

  function load(name) {
    sceneName = name;
    document.getElementById("hint").textContent = SCENES[name]();
    document.querySelectorAll("#scenes button").forEach((b) => b.classList.toggle("on", b.textContent === name));
  }

  // ---------------------------------------------------------------- UI
  for (const name of Object.keys(SCENES)) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => load(name);
    document.getElementById("scenes").appendChild(b);
  }
  const TOOLS = { drag: "Drag", box: "Box", ball: "Ball", poly: "Polygon", explode: "Explode", erase: "Erase" };
  for (const [key, label] of Object.entries(TOOLS)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.tool = key;
    b.onclick = () => { tool = key; document.querySelectorAll("#tools button").forEach((x) => x.classList.toggle("on", x === b)); };
    if (key === "drag") b.classList.add("on");
    document.getElementById("tools").appendChild(b);
  }
  const toggle = (id, fn) => { const b = document.getElementById(id); b.onclick = () => b.classList.toggle("on", fn()); };
  toggle("pause", () => (paused = !paused));
  toggle("slow", () => (slow = !slow));
  toggle("debug", () => (debug = !debug));
  document.getElementById("step").onclick = () => { paused = true; document.getElementById("pause").classList.add("on"); stepWorld(1 / 60); };
  document.getElementById("reset").onclick = () => load(sceneName);

  // ---------------------------------------------------------------- camera + input
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    view.scale = Math.min(canvas.width / 42, canvas.height / 22);
    view.cy = (canvas.height / view.scale) / 2 - 1.5;
  }
  addEventListener("resize", resize);
  resize();
  const toScreen = (p) => [canvas.width / 2 + (p.x - view.cx) * view.scale, canvas.height / 2 - (p.y - view.cy) * view.scale];
  const toWorld = (e) => {
    const r = canvas.getBoundingClientRect(), dpr = canvas.width / r.width;
    return V(((e.clientX - r.left) * dpr - canvas.width / 2) / view.scale + view.cx, -((e.clientY - r.top) * dpr - canvas.height / 2) / view.scale + view.cy);
  };

  canvas.addEventListener("pointerdown", (e) => {
    const p = toWorld(e);
    canvas.setPointerCapture(e.pointerId);
    const hit = world.bodyAt(p);
    if (tool === "erase") { if (hit) { world.remove(hit); if (world.mouse && world.mouse.body === hit) world.mouse = null; } return; }
    if (tool === "explode") {
      for (const b of world.bodies) {
        if (b.static) continue;
        const d = sub(b.pos, p), dist = Math.max(len(d), 0.5);
        if (dist < 8) b.vel = add(b.vel, scale(d, 60 / (dist * dist * Math.sqrt(b.mass) + 1)));
      }
      flashes.push({ p, t: 1 });
      return;
    }
    if (tool === "drag" || hit) {
      if (hit) world.mouse = { body: hit, local: hit.localPoint(p), target: p };
      return;
    }
    const opts = { color: nextColor(), restitution: tool === "ball" ? 0.4 : 0.15, friction: 0.6, angle: tool === "poly" ? Math.random() * 6 : 0 };
    const shape = tool === "box" ? box(1 + Math.random() * 0.6, 1 + Math.random() * 0.6)
      : tool === "ball" ? circle(0.4 + Math.random() * 0.4) : regular(3 + Math.floor(Math.random() * 4), 0.6 + Math.random() * 0.3);
    world.add(new Body(shape, p.x, p.y, opts));
  });
  canvas.addEventListener("pointermove", (e) => { if (world.mouse) world.mouse.target = toWorld(e); });
  const release = () => { world.mouse = null; };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);
  addEventListener("keydown", (e) => {
    const map = { "1": "drag", "2": "box", "3": "ball", "4": "poly", "5": "explode", "6": "erase" };
    if (map[e.key]) document.querySelector(`#tools button[data-tool=${map[e.key]}]`).click();
    if (e.key === " ") { e.preventDefault(); document.getElementById("pause").click(); }
    if (e.key.toLowerCase() === "r") load(sceneName);
  });

  // ---------------------------------------------------------------- simulation loop (fixed time step)
  let stepMs = 0, flashes = [];
  function stepWorld(dt) {
    const t0 = performance.now();
    world.step(dt);
    stepMs = stepMs * 0.9 + (performance.now() - t0) * 0.1;
    for (const b of world.bodies) if (!b.static && b.pos.y < -30) world.remove(b);   // tidy up things that fell off the world
    if (world.mouse && !world.bodies.includes(world.mouse.body)) world.mouse = null;
  }
  let last = performance.now(), acc = 0, fps = 60;
  function frame(now) {
    const elapsed = Math.min((now - last) / 1000, 0.1);
    last = now;
    fps = fps * 0.95 + (1 / Math.max(elapsed, 1e-3)) * 0.05;
    if (!paused) {
      acc += elapsed * (slow ? 0.25 : 1);
      let n = 0;
      while (acc >= 1 / 60 && n < 3) { stepWorld(1 / 60); acc -= 1 / 60; n++; }
      if (n === 3) acc = 0;                                         // can't keep up: drop time instead of spiralling
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------- drawing
  function draw() {
    g.fillStyle = "#0d1017";
    g.fillRect(0, 0, canvas.width, canvas.height);
    g.strokeStyle = "rgba(255,255,255,0.035)";                      // 1 m grid
    g.lineWidth = 1;
    const step = view.scale;
    for (let x = (canvas.width / 2 - view.cx * step) % step; x < canvas.width; x += step) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, canvas.height); g.stroke(); }
    for (let y = (canvas.height / 2 + view.cy * step) % step; y < canvas.height; y += step) { g.beginPath(); g.moveTo(0, y); g.lineTo(canvas.width, y); g.stroke(); }

    g.lineWidth = Math.max(1, view.scale / 16);
    for (const j of world.joints) {
      const [ax, ay] = toScreen(j.a.worldPoint(j.localA)), [bx, by] = toScreen(j.b.worldPoint(j.localB));
      g.strokeStyle = "#8b93a7";
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    }
    for (const b of world.bodies) {
      g.fillStyle = b.color || "#ffb454";
      g.strokeStyle = "rgba(0,0,0,0.35)";
      g.beginPath();
      if (b.shape.type === "circle") {
        const [x, y] = toScreen(b.pos);
        g.arc(x, y, b.shape.r * view.scale, 0, Math.PI * 2);
        g.fill(); g.stroke();
        const [ex, ey] = toScreen(b.worldPoint(V(b.shape.r * 0.85, 0)));   // a spoke shows the rotation
        g.strokeStyle = "rgba(0,0,0,0.4)";
        g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
      } else {
        b.world.forEach((p, i) => { const [x, y] = toScreen(p); i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.closePath(); g.fill(); g.stroke();
      }
    }
    if (world.mouse) {
      const [ax, ay] = toScreen(world.mouse.body.worldPoint(world.mouse.local)), [tx, ty] = toScreen(world.mouse.target);
      g.strokeStyle = "#ffb454"; g.setLineDash([6, 6]);
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(tx, ty); g.stroke(); g.setLineDash([]);
    }
    if (debug) {
      for (const arb of world.arbiters.values()) for (const c of arb.contacts) {
        const [x, y] = toScreen(c.point);
        g.fillStyle = c.depth >= 0 ? "#ff4757" : "#57a0ff";
        g.fillRect(x - 3, y - 3, 6, 6);
        g.strokeStyle = "#ff4757";
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + arb.normal.x * c.Pn * view.scale * 3, y - arb.normal.y * c.Pn * view.scale * 3); g.stroke();
      }
    }
    flashes = flashes.filter((f) => (f.t -= 0.04) > 0);
    for (const f of flashes) {
      const [x, y] = toScreen(f.p);
      g.strokeStyle = `rgba(255,180,84,${f.t})`;
      g.lineWidth = 3;
      g.beginPath(); g.arc(x, y, (1 - f.t) * 8 * view.scale, 0, Math.PI * 2); g.stroke();
    }
    const contacts = [...world.arbiters.values()].reduce((s, a) => s + a.contacts.length, 0);
    document.getElementById("stats").textContent =
      `${world.bodies.length} bodies · ${world.joints.length} joints · ${contacts} contacts · physics ${stepMs.toFixed(1)} ms · ${fps.toFixed(0)} fps`;
  }

  load("Pyramid");
  requestAnimationFrame(frame);
  window.__world = () => world;          // used by the browser test
  window.__load = load;
})();
</script>
</body>
</html>
